# Alembic config. The database URL comes from the app (DATABASE_URL, or local SQLite) — see migrations/env.py.
#
#   New migration after changing app/db.py:   alembic revision --autogenerate -m "add something"
#   Apply migrations manually:                python -m app.migrations
#   (They also run automatically: before each Railway deploy, and at app startup.)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
